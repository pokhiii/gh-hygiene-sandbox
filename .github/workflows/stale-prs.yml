name: Label stale PRs

# Labels open PRs with no activity for 10 days as "stale". Never closes PRs, never touches issues.
on:
  schedule:
    - cron: "30 4 * * *" # daily, 10:00 IST
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write # labels on PRs go through the issues API

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-pr-stale: 0
          days-before-pr-close: -1
          days-before-issue-stale: -1
          days-before-issue-close: -1
          stale-pr-label: stale
          stale-pr-message: "No activity for 10 days, so this PR is labelled `stale`. Any new activity removes the label."
