name: Delete branch on PR close

# Merged PRs: GitHub's "Automatically delete head branches" setting deletes the branch.
# Closed (not merged) PRs: this workflow deletes it. "Restore branch" on the PR brings it back.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    # Not merged, and the branch lives in this repo (not a fork).
    if: github.event.pull_request.merged == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete the PR's branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "Skipped: '$BRANCH' is the default branch."
            exit 0
          fi

          encoded=$(jq -rn --arg b "$BRANCH" '$b|@uri')

          if gh api "repos/$REPO/rules/branches/$encoded" --jq '.[].type' | grep -qx deletion; then
            echo "Skipped: a ruleset blocks deleting '$BRANCH'."
            exit 0
          fi

          if out=$(gh api -X DELETE "repos/$REPO/git/refs/heads/$encoded" 2>&1); then
            echo "Deleted '$BRANCH'."
          elif grep -qiE "Reference does not exist|Not Found|HTTP 404" <<<"$out"; then
            echo "'$BRANCH' was already deleted. Nothing to do."
          else
            echo "$out"
            exit 1
          fi
